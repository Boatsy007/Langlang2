<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicons ──────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="msapplication-TileColor" content="#09090b" />

    <!-- ── Base / fallback meta — overridden per-page by react-helmet-async -->
    <title>Lang Restorations | Vintage Motorcycle Restoration — Traralgon, Victoria</title>
    <meta name="description" content="Specialist vintage and classic motorcycle restoration in Traralgon, Gippsland. Engine rebuilds, vapour blasting, aluminium repairs, zinc plating and ground-up restorations. Serving Victoria and Australia since 2004." />
    <link rel="canonical" href="https://langrestorations.com.au/" />

    <!-- ── Open Graph fallback ───────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lang Restorations" />
    <meta property="og:url" content="https://langrestorations.com.au/" />
    <meta property="og:title" content="Lang Restorations — Vintage Motorcycle Restoration, Traralgon VIC" />
    <meta property="og:description" content="Factory-correct vintage and classic motorcycle restorations from Traralgon, Gippsland. Honda, Yamaha, Kawasaki and Suzuki specialists since 2004." />
    <meta property="og:image" content="https://langrestorations.com.au/images/hero.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale" content="en_AU" />

    <!-- ── Twitter / X fallback ─────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lang Restorations — Vintage Motorcycle Restoration, Traralgon VIC" />
    <meta name="twitter:description" content="Factory-correct vintage and classic motorcycle restorations from Traralgon, Gippsland. Honda, Yamaha, Kawasaki and Suzuki specialists since 2004." />
    <meta name="twitter:image" content="https://langrestorations.com.au/images/hero.jpg" />

    <!-- ── Geo / local ───────────────────────────────────────────────────── -->
    <meta name="geo.region" content="AU-VIC" />
    <meta name="geo.placename" content="Traralgon" />
    <meta name="geo.position" content="-38.1955;146.5378" />
    <meta name="ICBM" content="-38.1955, 146.5378" />

    <!-- ── Robots ─────────────────────────────────────────────────────────── -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- ── Performance: preload critical assets ─────────────────────────── -->
    <!-- Responsive WebP hero: mobile gets 41KB instead of 1.5MB JPG -->
    <link rel="preload" as="image"
      href="/images/hero-400.webp"
      imagesrcset="/images/hero-400.webp 400w, /images/hero-600.webp 600w, /images/hero-769.webp 769w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high" />
    <link rel="dns-prefetch" href="https://langrestorations.com.au" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
